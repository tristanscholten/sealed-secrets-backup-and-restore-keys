apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-secrets-key-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sealed-secrets-key-backup
        spec:
          serviceAccountName: sealed-secrets-key-backup
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: docker.io/alpine/k8s:1.35.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: MODE
                  value: orchestrate
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: BACKUP_NODE_LABEL
                  value: sealed-secrets-backup=true
                - name: SEALED_SECRETS_KEY_SELECTOR
                  value: sealedsecrets.bitnami.com/sealed-secrets-key
                - name: BACKUP_DIR
                  value: /backup
                # Optional S3-compatible endpoint support.
                # Leave S3_BUCKET empty to use node-local hostPath only.
                - name: S3_BUCKET
                  value: ""
                - name: S3_PREFIX
                  value: sealed-secrets-backup
                # Examples: https://s3.eu-central-1.amazonaws.com, https://minio.example.com.
                # Leave empty for AWS S3's default endpoint resolution.
                - name: S3_ENDPOINT_URL
                  value: ""
                - name: WORKER_TIMEOUT
                  value: 180s
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: sealed-secrets-key-backup-script
                defaultMode: 0555
