apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-backup-label-check
  namespace: sealed-secrets-backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealed-secrets-backup-label-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealed-secrets-backup-label-check
    spec:
      serviceAccountName: sealed-secrets-key-backup
      automountServiceAccountToken: true
      restartPolicy: Always
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: label-check
          image: docker.io/alpine/k8s:1.35.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/backup.sh"]
          env:
            - name: MODE
              value: check
            - name: BACKUP_NODE_LABEL
              value: sealed-secrets-backup=true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: sealed-secrets-key-backup-script
            defaultMode: 0555
