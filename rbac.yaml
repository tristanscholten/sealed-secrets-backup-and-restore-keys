apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-key-backup
  namespace: sealed-secrets-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sealed-secrets-key-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-key-backup-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-key-backup
    namespace: sealed-secrets-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sealed-secrets-key-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-secrets-backup-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-secrets-backup-node-reader
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-key-backup
    namespace: sealed-secrets-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sealed-secrets-backup-node-reader
